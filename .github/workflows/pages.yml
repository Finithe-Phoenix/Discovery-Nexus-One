name: Validate NEXUS ONE Enterprise

on:
  push:
    branches: [main, gh-pages, feat/enterprise-v3, feat/ui-v4-premium, feat/executive-experience-v5, feat/decision-v6]
  pull_request:
    branches: [main, gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Model, console, story, decision and PWA acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Validate sources and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          node --version
          node --check demo-store.js
          node --check enterprise.js
          node --check experience.js
          node --check decision.js
          node --check decision-model.js
          node --check sw.js
          test -s premium.css
          test -s experience.css
          grep -q 'experience.js?v=5.0.0' index.html
          grep -q 'enterprise.js?v=5.0.0' index.html
          grep -q 'experience.css?v=5.0.0' sw.js
          python -m json.tool manifest.webmanifest > /dev/null
          node --test tests/model.test.cjs tests/decision.test.cjs | tee test-results/model-tests.tap
      - name: Exercise console workflows over HTTP
        run: python tests/browser_smoke.py
      - name: Exercise story, visual layouts and offline reload
        run: python tests/experience_smoke.py
      - name: Exercise decision room, evidence and value scenarios
        run: python tests/decision_smoke.py
      - name: Record acceptance summary and source
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, zipfile
          from pathlib import Path
          Path('test-results').mkdir(exist_ok=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## NEXUS ONE Decision Edition v6\n\n')
              out.write('Commit: ' + os.environ['GITHUB_SHA'] + '\n\n')
              for name in ['browser-report.json', 'experience-report.json', 'decision-report.json']:
                  p = Path('test-results') / name
                  out.write('### ' + name + '\n\n')
                  if p.exists():
                      r = json.loads(p.read_text())
                      out.write(f"Mode: {r.get('mode')}\n\nPassed: {r.get('passed')}\n\nSkipped: {r.get('skipped', [])}\n\nJavaScript errors: {r.get('page_errors', [])}\n\n")
                  else:
                      out.write('Report unavailable. Review the failed step.\n\n')
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('test-results/NEXUS_ONE_Decision_Edition_v6.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  if name and Path(name).is_file():
                      z.write(name)
          Path('test-results/commit.txt').write_text(os.environ['GITHUB_SHA'] + '\n')
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: nexus-decision-v6-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
