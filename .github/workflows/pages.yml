name: Validate NEXUS ONE Enterprise

on:
  push:
    branches: [main, gh-pages, feat/enterprise-v3]
  pull_request:
    branches: [main, gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Model, browser and PWA acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Validate sources and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          node --version
          node --check demo-store.js
          node --check enterprise.js
          node --check sw.js
          python -m json.tool manifest.webmanifest > /dev/null
          node --test tests/model.test.cjs | tee test-results/model-tests.tap
      - name: Exercise browser workflows over HTTP
        run: python tests/browser_smoke.py
      - name: Record acceptance summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('test-results/browser-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## NEXUS ONE enterprise acceptance\n\n')
              if p.exists():
                  r = json.loads(p.read_text())
                  out.write(f"Mode: {r.get('mode')}\n\nPassed browser checks: {r.get('passed')}\n\nSkipped: {r.get('skipped', [])}\n\nJavaScript errors: {r.get('page_errors', [])}\n")
              else:
                  out.write('Browser report unavailable. Review the failed step.\n')
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: nexus-enterprise-v3-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
